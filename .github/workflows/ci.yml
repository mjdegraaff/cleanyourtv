name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lists-and-tools:
    name: Lists, tools and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools virtualenv
        run: |
          python3 -m venv tools/venv
          tools/venv/bin/pip install -q -r tools/requirements.txt
      - name: Example lists, README tables, shell helpers
        env:
          CLEANYOURTV_STRICT: ${{ github.event_name == 'push' && '1' || '' }}
        run: python3 -m unittest discover -s tests -v

  launcher:
    name: Launcher build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and release build
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: The launcher stays small
        # The 400 KB budget is for the launcher itself. The Home Assistant detail pages (assets/ha: map library,
        # font) only load when one is opened, so they get their own budget instead of eating the launcher's.
        run: |
          apk=launcher/app/build/outputs/apk/release/app-release.apk
          size=$(stat -c %s "$apk")
          ha=$(unzip -lv "$apk" | awk '$8 ~ /^assets\/ha\// {s += $3} END {print s + 0}')
          core=$((size - ha))
          echo "release APK: $((size / 1024)) KB, of which HA pages $((ha / 1024)) KB, launcher $((core / 1024)) KB"
          test "$core" -lt 409600 || { echo "Launcher is over 400 KB; it targets 1 GB TVs, keep it small"; exit 1; }
          test "$ha" -lt 512000 || { echo "HA pages are over 500 KB"; exit 1; }
