plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName '2.4-ha2'
    }

    // No signing key lives in this repository. CI creates a throwaway key for every build (see
    // .github/workflows/build-apk.yml) and passes it in through these variables; without them (a local
    // build) the debug key is used. A new key per build means an update is installed after an uninstall;
    // StateBackup keeps the owner's tile order across that.
    signingConfigs {
        ci {
            def ks = System.getenv('TVHOME_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('TVHOME_KEYSTORE_PASSWORD')
                keyAlias 'tvhome'
                keyPassword System.getenv('TVHOME_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: the CI throwaway key, or the debug key for a local build.
            signingConfig System.getenv('TVHOME_KEYSTORE') ? signingConfigs.ci : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
