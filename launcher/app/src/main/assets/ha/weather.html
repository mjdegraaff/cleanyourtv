<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weer</title>
<link rel="stylesheet" href="leaflet.css">
<link rel="stylesheet" href="maplibre-gl.css">
<link rel="stylesheet" href="common.css">
<style>
  .body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.75fr 1fr; gap: calc(var(--u) * 1.4); }
  .mapcard { padding: 0; }
  #map { position: absolute; inset: 0; border-radius: inherit; }
  .radar-bar { position: absolute; left: calc(var(--u) * 1.1); right: calc(var(--u) * 1.1); bottom: calc(var(--u) * 1.6); z-index: 500; display: flex; align-items: center; gap: calc(var(--u) * 1); background: rgba(7,10,20,.72); border: 1px solid var(--line); border-radius: 999px; padding: calc(var(--u) * .5) calc(var(--u) * 1.2); }
  .radar-bar .t { font-variant-numeric: tabular-nums; min-width: calc(var(--u) * 4.2); font-size: calc(var(--u) * 1.05); }
  .ticks { flex: 1; display: flex; gap: 3px; height: calc(var(--u) * .5); }
  .ticks i { flex: 1; border-radius: 2px; background: rgba(255,255,255,.18); }
  .ticks i.on { background: var(--rain); }
  .radar-bar .l { color: var(--text-3); font-size: calc(var(--u) * .85); }
  .map-title { position: absolute; left: calc(var(--u) * 1.3); top: calc(var(--u) * 1.1); z-index: 500; background: rgba(7,10,20,.6); border-radius: 999px; padding: calc(var(--u) * .35) calc(var(--u) * 1); }
  .radar { filter: saturate(1.4) contrast(1.15); }  /* rain stands out on the blue-grey map */
  .home-pin { width: 100%; height: 100%; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(255,255,255,.25), 0 0 18px rgba(255,255,255,.6); }

  .side { display: flex; flex-direction: column; gap: calc(var(--u) * 1); min-height: 0; }
  .now { display: grid; grid-template-columns: auto 1fr; column-gap: calc(var(--u) * 1.2); align-items: center; }
  .now .icon { font-size: calc(var(--u) * 4.8); line-height: 1; }
  .now .temp { font-weight: 200; font-size: calc(var(--u) * 5); line-height: 1; letter-spacing: -.02em; }
  .now .cond { color: var(--text-2); font-size: calc(var(--u) * 1.2); margin-top: calc(var(--u) * .2); }
  .now .cond::first-letter { text-transform: uppercase; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * .7) calc(var(--u) * 1.2); margin-top: calc(var(--u) * 1); }
  .facts .v { font-size: calc(var(--u) * 1.3); margin-top: calc(var(--u) * .15); }
  .arrow-w { display: inline-block; }

  .fc { flex: 1; display: flex; flex-direction: column; justify-content: space-between; min-height: 0; padding-top: calc(var(--u) * 1); padding-bottom: calc(var(--u) * 1); }
  .day { display: grid; grid-template-columns: calc(var(--u) * 3.4) calc(var(--u) * 2.4) 1fr calc(var(--u) * 3.2); align-items: center; gap: calc(var(--u) * .7); font-size: calc(var(--u) * 1.15); }
  .day .n { color: var(--text-2); }
  .day .ic { font-size: calc(var(--u) * 1.7); text-align: center; }
  .range { position: relative; height: calc(var(--u) * .45); border-radius: 999px; background: rgba(255,255,255,.1); }
  .range span { position: absolute; top: 0; bottom: 0; border-radius: 999px; background: linear-gradient(90deg, #7CC7FF, #FFC94D); }
  .range .lo, .range .hi { }
  .day .temps { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
  .day .pop { text-align: right; color: var(--rain); font-size: calc(var(--u) * .95); }
</style>
</head>
<body data-screen="weather">
<div class="screen">
  <header>
    <h1>Weer</h1>
    <span class="meta" id="meta"></span>
    <span class="spacer"></span>
    <div class="nav" id="nav"></div>
  </header>
  <div class="body">
    <div class="card mapcard">
      <div id="map"></div>
      <div class="map-title label">Buienradar · afgelopen 2 uur</div>
      <div class="radar-bar"><span class="t" id="rt">–</span><div class="ticks" id="ticks"></div><span class="l" id="rl"></span></div>
    </div>
    <div class="side">
      <div class="card">
        <div class="now"><div class="icon" id="icon"></div><div><div class="temp" id="temp">–</div><div class="cond" id="cond"></div></div></div>
        <div class="facts">
          <div><div class="label">Gevoel</div><div class="v" id="feels">–</div></div>
          <div><div class="label">Binnen</div><div class="v" id="indoor">–</div></div>
          <div><div class="label">Wind</div><div class="v" id="wind">–</div></div>
          <div><div class="label">Vochtigheid</div><div class="v" id="hum">–</div></div>
          <div><div class="label">Regen 24 u</div><div class="v" id="rain">–</div></div>
          <div><div class="label">Luchtdruk</div><div class="v" id="pres">–</div></div>
        </div>
      </div>
      <div class="card fc" id="fc"></div>
    </div>
  </div>
</div>
<div class="stale">Gegevens zijn ouder dan een kwartier</div>
<div class="empty"><b>Nog geen weergegevens</b>Home Assistant stuurt ze binnen een paar minuten.</div>

<script src="leaflet.js"></script>
<script src="maplibre-gl.js"></script>
<script src="leaflet-maplibre-gl.js"></script>
<script src="common.js"></script>
<script>
HA.nav(document.getElementById('nav'));
var ICON = { 'clear-night': '🌙', cloudy: '☁️', fog: '🌫️', hail: '🌨️', lightning: '🌩️', 'lightning-rainy': '⛈️', partlycloudy: '⛅', pouring: '🌧️', rainy: '🌦️', snowy: '❄️', 'snowy-rainy': '🌨️', sunny: '☀️', windy: '💨', 'windy-variant': '💨', exceptional: '⚠️' };
var NL = { 'clear-night': 'helder', cloudy: 'bewolkt', fog: 'mist', hail: 'hagel', lightning: 'onweer', 'lightning-rainy': 'onweersbuien', partlycloudy: 'half bewolkt', pouring: 'zware regen', rainy: 'regen', snowy: 'sneeuw', 'snowy-rainy': 'natte sneeuw', sunny: 'zonnig', windy: 'harde wind', 'windy-variant': 'harde wind', exceptional: 'extreem weer' };
var DIRS = ['N', 'NNO', 'NO', 'ONO', 'O', 'OZO', 'ZO', 'ZZO', 'Z', 'ZZW', 'ZW', 'WZW', 'W', 'WNW', 'NW', 'NNW'];

var map = null, frames = [], layers = [], frame = 0, timer = null, radarLoaded = 0;

function setupMap(home) {
  if (map) return;
  var c = home && home.lat ? [home.lat, home.lon] : [52.0, 5.46];
  map = L.map('map', { zoomControl: false, attributionControl: true, keyboard: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false, touchZoom: false, fadeAnimation: true })
    .setView([c[0] + 0.35, c[1]], 7);
  map.attributionControl.setPrefix(false);
  // OpenFreeMap: free vector map, no key. Own pane under the radar tiles.
  map.createPane('base').style.zIndex = 150;
  L.maplibreGL({ style: 'https://tiles.openfreemap.org/styles/fiord', pane: 'base', attribution: 'OpenFreeMap © OpenMapTiles · © OpenStreetMap · RainViewer' }).addTo(map);
  L.marker(c, { icon: L.divIcon({ className: '', html: '<div class="home-pin"></div>', iconSize: [12, 12] }), interactive: false, keyboard: false }).addTo(map);
  loadRadar();
  setInterval(loadRadar, 10 * 60 * 1000);
}

function loadRadar() {
  var x = new XMLHttpRequest();
  x.open('GET', 'https://api.rainviewer.com/public/weather-maps.json');
  x.timeout = 15000;
  x.onload = function () {
    try {
      var j = JSON.parse(x.responseText);
      var past = (j.radar && j.radar.past) || [];
      if (!past.length) return;
      layers.forEach(function (l) { map.removeLayer(l); });
      frames = past; layers = [];
      past.forEach(function (f) {
        var l = L.tileLayer(j.host + f.path + '/256/{z}/{x}/{y}/2/1_1.png', { opacity: 0, maxNativeZoom: 7, className: 'radar', maxZoom: 12, zIndex: 300 });
        l.addTo(map); layers.push(l);
      });
      var ticks = document.getElementById('ticks');
      ticks.innerHTML = past.map(function () { return '<i></i>'; }).join('');
      frame = past.length - 1;
      show(frame);
      if (timer) clearInterval(timer);
      timer = setInterval(function () {
        // Play the 2 hours, then rest a moment on the latest picture.
        frame = frame >= frames.length - 1 ? -3 : frame + 1;
        if (frame >= 0) show(frame);
      }, 650);
    } catch (e) { document.getElementById('rl').textContent = 'radar niet beschikbaar'; }
  };
  x.onerror = x.ontimeout = function () { document.getElementById('rl').textContent = 'radar niet bereikbaar'; };
  x.send();
}

function show(i) {
  layers.forEach(function (l, k) { l.setOpacity(k === i ? 0.9 : 0); });
  var t = new Date(frames[i].time * 1000);
  document.getElementById('rt').textContent = ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2);
  var mins = Math.round((Date.now() - t) / 60000);
  document.getElementById('rl').textContent = i === frames.length - 1 ? 'laatste beeld' : mins + ' min geleden';
  var ts = document.getElementById('ticks').children;
  for (var k = 0; k < ts.length; k++) ts[k].className = k <= i ? 'on' : '';
}

function deg(v) { return v === null || v === undefined || isNaN(v) ? '–' : HA.num(v, 0) + '°'; }

function render(data) {
  var w = data.weather || {};
  setupMap(data.home);
  document.getElementById('meta').textContent = data.updated ? 'bijgewerkt ' + HA.time(data.updated) : '';
  document.getElementById('icon').textContent = ICON[w.cond] || '🌡️';
  document.getElementById('temp').textContent = deg(w.temp);
  document.getElementById('cond').textContent = NL[w.cond] || w.cond || '';
  document.getElementById('feels').textContent = deg(w.feels);
  document.getElementById('indoor').textContent = deg(w.indoor);
  var dir = w.bearing !== undefined && w.bearing !== null ? DIRS[Math.round(w.bearing / 22.5) % 16] : '';
  document.getElementById('wind').innerHTML = (w.bearing !== undefined && w.bearing !== null ? '<span class="arrow-w" style="transform:rotate(' + (w.bearing + 180) + 'deg)">↑</span> ' : '')
    + dir + ' ' + (w.beaufort !== undefined ? w.beaufort + ' Bft' : HA.num(w.wind) + ' km/u');
  document.getElementById('hum').textContent = w.hum !== undefined ? HA.num(w.hum) + '%' : '–';
  document.getElementById('rain').textContent = w.rain24 !== undefined ? HA.num(w.rain24, 1) + ' mm' : '–';
  document.getElementById('pres').textContent = w.pressure ? HA.num(w.pressure) + ' hPa' : '–';

  var fc = w.forecast || [], lo = 99, hi = -99;
  fc.forEach(function (d) { lo = Math.min(lo, d.lo); hi = Math.max(hi, d.hi); });
  var span = Math.max(1, hi - lo);
  document.getElementById('fc').innerHTML = '<div class="label">Komende dagen</div>' + fc.slice(0, 5).map(function (d) {
    var a = (d.lo - lo) / span * 100, b = (d.hi - lo) / span * 100;
    return '<div class="day"><span class="n">' + d.d + '</span><span class="ic">' + (ICON[d.cond] || '') + '</span>'
      + '<div><div class="temps"><span>' + deg(d.lo) + '</span><span>' + deg(d.hi) + '</span></div><div class="range"><span style="left:' + a + '%;right:' + (100 - b) + '%"></span></div></div>'
      + '<span class="pop">' + (d.pop ? d.pop + '%' : '') + '</span></div>';
  }).join('');
}
HA.start(render);
</script>
</body>
</html>
