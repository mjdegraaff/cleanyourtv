<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Energie</title>
<link rel="stylesheet" href="common.css">
<style>
  .top { display: grid; grid-template-columns: 1.05fr 1fr; gap: calc(var(--u) * 1.4); flex: 0 0 auto; }
  .bottom { display: grid; grid-template-columns: 1.6fr 1fr; gap: calc(var(--u) * 1.4); flex: 1; min-height: 0; }

  /* Live flow: sun and grid feed the house. */
  .flow { padding: calc(var(--u) * 1.1) calc(var(--u) * 1.4); }
  .flow svg { width: 100%; height: calc(var(--u) * 20); display: block; }
  /* Power Flow Card Plus look: label outside the bubble, value inside (font sizes in viewBox units) */
  .flow .pf-v { font-size: 12.5px; font-weight: 500; fill: #fff; }
  .flow .pf-s { font-size: 10.5px; font-weight: 500; fill: #fff; }
  .flow .pf-l { font-size: 11.5px; fill: rgba(255,255,255,.66); }

  :root { --bat: #B79CFF; --gas: #FF9E7A; }
  .today { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: calc(var(--u) * 1); }
  .today .card { padding: calc(var(--u) * 1) calc(var(--u) * 1.3); }
  .today .big { font-size: calc(var(--u) * 2.2); }
  .dot { display: inline-block; width: calc(var(--u) * .6); height: calc(var(--u) * .6); border-radius: 50%; margin-right: calc(var(--u) * .45); vertical-align: middle; }
  .ring { position: absolute; right: calc(var(--u) * 1.1); top: 50%; transform: translateY(-50%); width: calc(var(--u) * 4.2); height: calc(var(--u) * 4.2); }

  .chart { display: flex; flex-direction: column; min-height: 0; }
  .chart .head { display: flex; align-items: baseline; gap: calc(var(--u) * 1.2); }
  .chart .legend { margin-left: auto; display: flex; gap: calc(var(--u) * 1.1); color: var(--text-2); font-size: calc(var(--u) * .85); }
  .chart svg { flex: 1; width: 100%; min-height: 0; margin-top: calc(var(--u) * .6); }
  .axis { font-size: calc(var(--u) * .72); fill: rgba(255,255,255,.42); }
  .gridline { stroke: rgba(255,255,255,.08); stroke-width: 1; }
  .zero { stroke: rgba(255,255,255,.28); stroke-width: 1; }
  .zero.dash { stroke-dasharray: 3 4; }
  .l-sun { fill: none; stroke: var(--sun); stroke-width: 2.2; stroke-linejoin: round; }
  .a-sun { fill: var(--sun); fill-opacity: .22; stroke: none; }
  .l-home { fill: none; stroke: var(--home); stroke-width: 2.4; stroke-linejoin: round; }
  .l-grid { fill: none; stroke: var(--grid); stroke-width: 1.8; stroke-linejoin: round; opacity: .9; }
  .l-bat { fill: none; stroke: var(--bat); stroke-width: 2; stroke-linejoin: round; }
  .nowline { stroke: rgba(255,255,255,.45); stroke-width: 1.2; stroke-dasharray: 3 4; }
</style>
</head>
<body data-screen="energy">
<div class="screen">
  <header>
    <h1>Energie</h1>
    <span class="meta" id="meta"></span>
    <span class="spacer"></span>
    <div class="nav" id="nav"></div>
  </header>

  <div class="top">
    <div class="card flow">
      <div class="label">Nu</div>
      <svg id="flow" viewBox="22 6 340 316" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="today">
      <div class="card"><div class="label"><span class="dot" style="background:var(--sun)"></span>Zon vandaag</div><div class="big" id="tSol"></div><div class="sub" id="tSolSub"></div></div>
      <div class="card"><div class="label"><span class="dot" style="background:var(--home)"></span>Verbruik vandaag</div><div class="big" id="tUse"></div><div class="sub" id="tUseSub"></div><svg class="ring" id="ring" viewBox="0 0 42 42"></svg></div>
      <div class="card"><div class="label"><span class="dot" style="background:var(--grid)"></span>Van het net</div><div class="big" id="tImp"></div><div class="sub" id="tImpSub"></div></div>
      <div class="card"><div class="label"><span class="dot" style="background:var(--export)"></span>Teruggeleverd</div><div class="big" id="tExp"></div><div class="sub" id="tExpSub"></div></div>
      <div class="card"><div class="label"><span class="dot" style="background:var(--bat)"></span>Accu</div><div class="big" id="tBat"></div><div class="sub" id="tBatSub"></div></div>
      <div class="card"><div class="label"><span class="dot" style="background:var(--gas)"></span>Gas vandaag</div><div class="big" id="tGas"></div><div class="sub" id="tGasSub"></div></div>
    </div>
  </div>

  <div class="bottom">
    <div class="card chart">
      <div class="head"><div class="label" id="hoursLbl">Vandaag</div>
        <div class="legend" id="hoursLeg"></div></div>
      <svg id="hours" preserveAspectRatio="none"></svg>
    </div>
    <div class="card chart">
      <div class="head"><div class="label">Afgelopen 7 dagen</div>
        <div class="legend"><span><span class="dot" style="background:var(--home)"></span>verbruik</span><span><span class="dot" style="background:var(--sun)"></span>zon</span></div></div>
      <svg id="days" preserveAspectRatio="none"></svg>
    </div>
  </div>
</div>
<div class="stale">Gegevens zijn ouder dan een kwartier</div>
<div class="empty"><b>Nog geen energiegegevens</b>Home Assistant stuurt ze binnen een paar minuten.</div>

<script src="common.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
HA.nav(document.getElementById('nav'));

function el(tag, attrs, text) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  return e;
}
function kwh(v, dec) { return HA.num(v, dec === undefined ? (v < 10 ? 1 : 0) : dec) + '<small>kWh</small>'; }

// Live flow in the look of Power Flow Card Plus (as on the phone and the Nest Hub): one sun bubble,
// grid left, house right, battery below, gas top right; dots run along the lines, faster at more power.
var ICON = {
  sun: 'M3.33 16H11V13H4L3.33 16M13 16H20.67L20 13H13V16M21.11 18H13V22H22L21.11 18M2 22H11V18H2.89L2 22M11 8H13V11H11V8M15.76 7.21L17.18 5.79L19.3 7.91L17.89 9.33L15.76 7.21M4.71 7.91L6.83 5.79L8.24 7.21L6.12 9.33L4.71 7.91M3 2H6V4H3V2M18 2H21V4H18V2M12 7C14.76 7 17 4.76 17 2H7C7 4.76 9.24 7 12 7Z',
  grid: 'M8.28,5.45L6.5,4.55L7.76,2H16.23L17.5,4.55L15.72,5.44L15,4H9L8.28,5.45M18.62,8H14.09L13.3,5H10.7L9.91,8H5.38L4.1,10.55L5.89,11.44L6.62,10H17.38L18.1,11.45L19.89,10.56L18.62,8M17.77,22H15.7L15.46,21.1L12,15.9L8.53,21.1L8.3,22H6.23L9.12,11H11.19L10.83,12.35L12,14.1L13.16,12.35L12.81,11H14.88L17.77,22M11.4,15L10.5,13.65L9.32,18.13L11.4,15M14.68,18.12L13.5,13.64L12.6,15L14.68,18.12Z',
  home: 'M10,20V14H14V20H19V12H22L12,3L2,12H5V20H10Z',
  batHigh: 'M16 20H8V6H16M16.67 4H15V2H9V4H7.33C6.6 4 6 4.6 6 5.33V20.67C6 21.4 6.6 22 7.33 22H16.67C17.41 22 18 21.41 18 20.67V5.33C18 4.6 17.4 4 16.67 4M15 16H9V19H15V16M15 7H9V10H15V7M15 11.5H9V14.5H15V11.5Z',
  batMed: 'M16 20H8V6H16M16.67 4H15V2H9V4H7.33C6.6 4 6 4.6 6 5.33V20.67C6 21.4 6.6 22 7.33 22H16.67C17.41 22 18 21.41 18 20.67V5.33C18 4.6 17.4 4 16.67 4M15 16H9V19H15V16M15 11.5H9V14.5H15V11.5Z',
  batLow: 'M16 20H8V6H16M16.67 4H15V2H9V4H7.33C6.6 4 6 4.6 6 5.33V20.67C6 21.4 6.6 22 7.33 22H16.67C17.41 22 18 21.41 18 20.67V5.33C18 4.6 17.4 4 16.67 4M15 16H9V19H15V16',
  batChg: 'M16.67,4H15V2H9V4H7.33A1.33,1.33 0 0,0 6,5.33V20.66C6,21.4 6.6,22 7.33,22H16.66C17.4,22 18,21.4 18,20.67V5.33C18,4.6 17.4,4 16.67,4M11,20V14.5H9L13,7V12.5H15',
  fire: 'M17.66 11.2C17.43 10.9 17.15 10.64 16.89 10.38C16.22 9.78 15.46 9.35 14.82 8.72C13.33 7.26 13 4.850 13.95 3C13 3.23 12.17 3.75 11.46 4.32C8.87 6.4 7.85 10.07 9.07 13.22C9.11 13.32 9.15 13.42 9.15 13.55C9.15 13.77 9 13.97 8.8 14.05C8.57 14.15 8.33 14.09 8.14 13.930C8.08 13.88 8.04 13.83 8 13.76C6.87 12.33 6.69 10.28 7.45 8.64C5.78 10 4.87 12.3 5 14.47C5.06 14.97 5.12 15.47 5.29 15.970C5.43 16.57 5.7 17.17 6 17.7C7.08 19.43 8.95 20.67 10.96 20.92C13.1 21.19 15.39 20.8 17.03 19.32C18.86 17.66 19.5 15 18.56 12.72L18.43 12.46C18.22 12 17.66 11.2 17.66 11.2M14.5 17.5C14.22 17.74 13.76 18 13.4 18.1C12.28 18.5 11.16 17.94 10.5 17.28C11.690 17 12.4 16.12 12.61 15.23C12.78 14.43 12.46 13.77 12.33 13C12.21 12.26 12.23 11.63 12.5 10.94C12.69 11.32 12.89 11.7 13.13 12C13.9 13 15.11 13.44 15.37 14.8C15.41 14.940 15.43 15.08 15.43 15.23C15.46 16.05 15.1 16.95 14.5 17.5H14.5Z'
};
// Power Flow Card Plus default colours (Home Assistant energy colours).
var PF = { sun: '#ff9800', imp: '#488fc2', exp: '#8353d3', batOut: '#4db6ac', batIn: '#f06292', gas: '#d0cc5b', none: 'rgba(255,255,255,.28)' };

function pfW(w) { w = Math.abs(w || 0); return w >= 1000 ? HA.num(w / 1000, 1) + ' kW' : HA.num(Math.round(w)) + ' W'; }

function drawFlow(now, gasToday) {
  var svg = document.getElementById('flow');
  svg.innerHTML = '';
  var TH = 10;
  var sol = Math.max(0, now.solar || 0), grid = now.grid || 0, bat = now.bat || 0;   // grid > 0 afname; bat > 0 accu levert
  var hasBat = now.soc !== undefined && now.soc !== null;
  var hasGas = now.gas_live !== undefined;
  if (!hasBat) bat = 0;
  var imp = Math.max(0, grid), exp = Math.max(0, -grid), chg = Math.max(0, -bat), dis = Math.max(0, bat);
  // who feeds whom, same order as PFC+: sun first to grid export and battery, the rest to the house
  var s2g = Math.min(exp, sol), s2b = Math.min(chg, sol - s2g), s2h = Math.max(0, sol - s2g - s2b);
  var b2g = Math.min(dis, Math.max(0, exp - s2g)), b2h = Math.max(0, dis - b2g);
  var g2b = Math.min(imp, Math.max(0, chg - s2b)), g2h = Math.max(0, imp - g2b);
  var home = s2h + b2h + g2h;

  var R = 34, SX = 190, SY = 62, GX = 62, GY = 166, HX = 318, HY = 166, BX = 190, BY = 270, XX = 318, XY = 62;
  var maxF = Math.max(s2h, s2g, s2b, b2h, b2g, g2h, g2b, 1);

  function line(d, color, w, rev) {
    svg.appendChild(el('path', { d: d, fill: 'none', stroke: color, 'stroke-width': 1.6, 'stroke-opacity': w > TH ? 1 : .35 }));
    if (w <= TH) return;
    // dot speed like PFC+: 1.5 s at the largest flow, up to 6 s at small flows
    var dur = (6 - 4.5 * Math.min(1, w / maxF)).toFixed(2) + 's';
    var c = el('circle', { r: 3.4, fill: color });
    var a = el('animateMotion', { dur: dur, repeatCount: 'indefinite', path: d, calcMode: 'linear' });
    if (rev) { a.setAttribute('keyPoints', '1;0'); a.setAttribute('keyTimes', '0;1'); }
    c.appendChild(a);
    svg.appendChild(c);
  }
  var gArc = 'M' + (GX + R) + ' ' + GY;
  // sun -> grid / house, grid -> house, battery <- sun / grid, battery -> house
  line('M' + (SX - 8) + ' ' + (SY + R) + ' V' + (GY - 26) + ' Q' + (SX - 8) + ' ' + (GY - 8) + ' ' + (SX - 26) + ' ' + (GY - 8) + ' H' + (GX + R - 2), PF.exp, s2g + b2g, false);
  line('M' + (SX + 8) + ' ' + (SY + R) + ' V' + (HY - 26) + ' Q' + (SX + 8) + ' ' + (HY - 8) + ' ' + (SX + 26) + ' ' + (HY - 8) + ' H' + (HX - R + 2), PF.sun, s2h, false);
  line('M' + (GX + R) + ' ' + GY + ' H' + (HX - R), PF.imp, g2h, false);
  if (hasBat) {
    line('M' + SX + ' ' + (SY + R) + ' V' + (BY - R), PF.batIn, s2b, false);
    line('M' + (GX + R - 2) + ' ' + (GY + 8) + ' H' + (BX - 26) + ' Q' + (BX - 8) + ' ' + (GY + 8) + ' ' + (BX - 8) + ' ' + (GY + 26) + ' V' + (BY - R), PF.batIn, g2b, false);
    line('M' + (BX + 8) + ' ' + (BY - R) + ' V' + (HY + 26) + ' Q' + (BX + 8) + ' ' + (HY + 8) + ' ' + (BX + 26) + ' ' + (HY + 8) + ' H' + (HX - R + 2), PF.batOut, b2h, false);
  }
  if (hasGas) line('M' + XX + ' ' + (XY + R) + ' V' + (HY - R), PF.gas, now.gas_live ? maxF * .3 : 0, true);

  function icon(name, x, y, color, size) {
    var s = size / 24;
    svg.appendChild(el('path', { d: ICON[name], fill: color, transform: 'translate(' + (x - size / 2) + ' ' + (y - size / 2) + ') scale(' + s + ')' }));
  }
  function bubble(x, y, color, label, labelBelow) {
    svg.appendChild(el('circle', { cx: x, cy: y, r: R, fill: 'rgba(7,10,20,.55)', stroke: color, 'stroke-width': 2 }));
    svg.appendChild(el('text', { x: x, y: labelBelow ? y + R + 15 : y - R - 7, class: 'pf-l', 'text-anchor': 'middle' }, label));
  }
  function txt(x, y, s, cls, color) { var t = el('text', { x: x, y: y, class: cls, 'text-anchor': 'middle' }, s); if (color) t.setAttribute('fill', color); svg.appendChild(t); }

  // Zon
  bubble(SX, SY, PF.sun, 'Zon', false);
  icon('sun', SX, SY - 8, PF.sun, 20);
  txt(SX, SY + 15, pfW(sol), 'pf-v');
  // Net: <- teruglevering, -> afname
  bubble(GX, GY, imp > TH ? PF.imp : exp > TH ? PF.exp : PF.imp, 'Net', true);
  icon('grid', GX, GY - 14, 'rgba(255,255,255,.9)', 20);
  txt(GX, GY + 6, '← ' + pfW(exp), 'pf-s', PF.exp);
  txt(GX, GY + 21, '→ ' + pfW(imp), 'pf-s', PF.imp);
  // Huis: rand verdeeld naar herkomst (zon, accu, net) zoals PFC+
  var C = 2 * Math.PI * R, off = 0;
  svg.appendChild(el('circle', { cx: HX, cy: HY, r: R, fill: 'rgba(7,10,20,.55)', stroke: PF.none, 'stroke-width': 2 }));
  [[s2h, PF.sun], [b2h, PF.batOut], [g2h, PF.imp]].forEach(function (p) {
    if (home <= 0 || p[0] <= 0) return;
    var len = C * p[0] / home;
    svg.appendChild(el('circle', { cx: HX, cy: HY, r: R, fill: 'none', stroke: p[1], 'stroke-width': 2.6,
      'stroke-dasharray': len.toFixed(2) + ' ' + C.toFixed(2), 'stroke-dashoffset': (-off).toFixed(2), transform: 'rotate(-90 ' + HX + ' ' + HY + ')' }));
    off += len;
  });
  svg.appendChild(el('text', { x: HX, y: HY + R + 15, class: 'pf-l', 'text-anchor': 'middle' }, 'Huis'));
  icon('home', HX, HY - 9, 'rgba(255,255,255,.9)', 22);
  txt(HX, HY + 15, pfW(home), 'pf-v');
  // Accu: laadstand boven, in/uit onder
  if (hasBat) {
    bubble(BX, BY, dis > TH ? PF.batOut : chg > TH ? PF.batIn : PF.batOut, 'Accu', true);
    var soc = Math.round(now.soc);
    txt(BX, BY - 17, soc + ' %', 'pf-s');
    icon(chg > TH ? 'batChg' : soc < 20 ? 'batLow' : soc < 60 ? 'batMed' : 'batHigh', BX, BY - 3, 'rgba(255,255,255,.9)', 14);
    txt(BX, BY + 15, '↓ ' + pfW(chg), 'pf-s', PF.batIn);
    txt(BX, BY + 28, '↑ ' + pfW(dis), 'pf-s', PF.batOut);
  }
  // Gas vandaag
  if (hasGas) {
    bubble(XX, XY, PF.gas, 'Gas', false);
    icon('fire', XX, XY - 8, PF.gas, 20);
    txt(XX, XY + 15, gasToday !== undefined && gasToday !== null ? HA.num(gasToday, 1) + ' m³' : '–', 'pf-v');
  }
}

function ring(pct) {
  var svg = document.getElementById('ring');
  svg.innerHTML = '';
  var r = 17, c = 2 * Math.PI * r, p = Math.max(0, Math.min(1, pct));
  svg.appendChild(el('circle', { cx: 21, cy: 21, r: r, fill: 'none', stroke: 'rgba(255,255,255,.12)', 'stroke-width': 4 }));
  svg.appendChild(el('circle', { cx: 21, cy: 21, r: r, fill: 'none', stroke: getComputedStyle(document.documentElement).getPropertyValue('--sun'), 'stroke-width': 4,
    'stroke-dasharray': (c * p) + ' ' + c, 'stroke-linecap': 'round', transform: 'rotate(-90 21 21)' }));
  svg.appendChild(el('text', { x: 21, y: 24.5, 'text-anchor': 'middle', fill: '#fff', 'font-size': 10 }, Math.round(p * 100) + '%'));
}

// Bars in a box measured in pixels, so text never stretches.
function box(svg) {
  var r = svg.getBoundingClientRect();
  svg.setAttribute('viewBox', '0 0 ' + r.width + ' ' + r.height);
  svg.innerHTML = '';
  return { w: r.width, h: r.height };
}
function niceMax(v) {
  if (v <= 0) return 1;
  var steps = [0.2, 0.5, 1, 2, 3, 5, 10, 20, 30, 50, 100];
  for (var i = 0; i < steps.length; i++) if (v <= steps[i]) return steps[i];
  return Math.ceil(v / 50) * 50;
}

function drawHours(list) {
  // list: [{h: local hour, imp, exp, sol}]; the clock-change hour can appear twice, so add them up.
  var hours = [];
  list.forEach(function (x) {
    var k = x.h, o = hours[k] || (hours[k] = { imp: 0, exp: 0, sol: 0 });
    o.imp += x.imp || 0; o.exp += x.exp || 0; o.sol += x.sol || 0;
  });
  var svg = document.getElementById('hours'), b = box(svg), cs = getComputedStyle(document.documentElement);
  var left = 34, right = 6, top = 6, bottom = 20;
  var W = b.w - left - right, H = b.h - top - bottom;
  var up = 0, down = 0;
  hours.forEach(function (x) { if (!x) return; up = Math.max(up, (x.imp || 0) + Math.max(0, (x.sol || 0) - (x.exp || 0))); down = Math.max(down, x.exp || 0); });
  var max = niceMax(Math.max(up, down * 1.0, 0.4));
  var downMax = down > 0 ? niceMax(down) : 0;
  var total = max + downMax;
  var zeroY = top + H * (max / total);
  var scale = H / total;
  [max, max / 2].forEach(function (v) {
    var y = zeroY - v * scale;
    svg.appendChild(el('line', { x1: left, x2: b.w - right, y1: y, y2: y, class: 'gridline' }));
    svg.appendChild(el('text', { x: left - 6, y: y + 4, 'text-anchor': 'end', class: 'axis' }, HA.num(v, v < 1 ? 1 : 0)));
  });
  if (downMax) {
    var yd = zeroY + downMax * scale;
    svg.appendChild(el('text', { x: left - 6, y: yd, 'text-anchor': 'end', class: 'axis' }, '-' + HA.num(downMax, downMax < 1 ? 1 : 0)));
  }
  svg.appendChild(el('text', { x: 2, y: top + 9, class: 'axis' }, 'kWh'));
  var slot = W / 24, bw = Math.max(2, slot * 0.62), now = new Date().getHours();
  for (var h = 0; h < 24; h++) {
    var x = left + h * slot + (slot - bw) / 2;
    var d = hours[h];
    if (d) {
      var own = Math.max(0, (d.sol || 0) - (d.exp || 0)), imp = d.imp || 0, exp = d.exp || 0;
      var y = zeroY;
      if (own > 0) { y -= own * scale; svg.appendChild(el('rect', { x: x, y: y, width: bw, height: own * scale, rx: 2, fill: cs.getPropertyValue('--sun') })); }
      if (imp > 0) { var hh = imp * scale; svg.appendChild(el('rect', { x: x, y: y - hh, width: bw, height: hh, rx: 2, fill: cs.getPropertyValue('--grid') })); }
      if (exp > 0) svg.appendChild(el('rect', { x: x, y: zeroY, width: bw, height: exp * scale, rx: 2, fill: cs.getPropertyValue('--export') }));
    }
    if (h % 3 === 0) svg.appendChild(el('text', { x: left + h * slot + slot / 2, y: b.h - 4, 'text-anchor': 'middle', class: 'axis' }, ('0' + h).slice(-2)));
    if (h === now) svg.appendChild(el('rect', { x: left + h * slot, y: top, width: slot, height: H, fill: 'rgba(255,255,255,.05)' }));
  }
  svg.appendChild(el('line', { x1: left, x2: b.w - right, y1: zeroY, y2: zeroY, class: 'zero' }));
}

// Day curve, same as the Nest Hub: 5-minute averages of sun, house and grid (kW). series: [[slot, solarW, gridW], ...]
function drawCurve(series) {
  var svg = document.getElementById('hours'), b = box(svg);
  var d0 = new Date(); d0.setHours(0, 0, 0, 0);
  var d1 = new Date(d0); d1.setDate(d1.getDate() + 1);
  var N = Math.max(288, Math.round((d1 - d0) / 300000));   // 300 slots on the clock-change day
  var pts = series.filter(function (r) { return r && r[0] >= 0 && r[0] < N; }).sort(function (a, b2) { return a[0] - b2[0]; });
  var vals = [];
  var hasBat = false;
  pts.forEach(function (r) {
    var s = Math.max(0, r[1] || 0), g = r[2] || 0, bt = r.length > 3 && r[3] !== null ? r[3] : null;
    r.s = s; r.g = g; r.b = bt || 0; r.h = Math.max(0, s + g + r.b); vals.push(s, g, r.h);
    if (bt !== null) { hasBat = true; vals.push(bt); }
  });
  var max = Math.max(1000, Math.max.apply(null, vals)), min = Math.min(0, Math.min.apply(null, vals));
  var range = max - min, step = range <= 3000 ? 1000 : range <= 8000 ? 2000 : 5000;
  max = Math.ceil(max / step) * step; min = Math.floor(min / step) * step;
  var left = 34, right = 8, top = 8, bottom = 20;
  var W = b.w - left - right, H = b.h - top - bottom;
  function x(i) { return left + i / (N - 1) * W; }
  function y(v) { return top + (max - v) / (max - min) * H; }
  for (var v = min; v <= max; v += step) {
    svg.appendChild(el('line', { x1: left, x2: b.w - right, y1: y(v), y2: y(v), class: v === 0 ? 'zero dash' : 'gridline' }));
    svg.appendChild(el('text', { x: left - 6, y: y(v) + 4, 'text-anchor': 'end', class: 'axis' }, HA.num(v / 1000)));
  }
  svg.appendChild(el('text', { x: 2, y: top + 9, class: 'axis' }, 'kW'));
  for (var h = 0; h <= 24; h += 3) {
    svg.appendChild(el('text', { x: x(Math.min(N - 1, h * 12)), y: b.h - 4, 'text-anchor': h === 0 ? 'start' : h === 24 ? 'end' : 'middle', class: 'axis' }, ('0' + h).slice(-2) + ':00'));
  }
  // Lines break where the 5-minute statistics have a gap.
  function path(key) {
    var dd = '', prev = -2;
    pts.forEach(function (r) { dd += (r[0] === prev + 1 ? 'L' : 'M') + x(r[0]).toFixed(1) + ',' + y(r[key]).toFixed(1); prev = r[0]; });
    return dd;
  }
  if (pts.length) {
    var area = '', seg = [];
    function flush() { if (seg.length) { area += 'M' + x(seg[0][0]).toFixed(1) + ',' + y(0).toFixed(1); seg.forEach(function (r) { area += 'L' + x(r[0]).toFixed(1) + ',' + y(r.s).toFixed(1); }); area += 'L' + x(seg[seg.length - 1][0]).toFixed(1) + ',' + y(0).toFixed(1) + 'Z'; } seg = []; }
    pts.forEach(function (r, k) { if (k && r[0] !== pts[k - 1][0] + 1) flush(); seg.push(r); });
    flush();
    svg.appendChild(el('path', { d: area, class: 'a-sun' }));
    svg.appendChild(el('path', { d: path('s'), class: 'l-sun' }));
    svg.appendChild(el('path', { d: path('g'), class: 'l-grid' }));
    if (hasBat) svg.appendChild(el('path', { d: path('b'), class: 'l-bat' }));
    svg.appendChild(el('path', { d: path('h'), class: 'l-home' }));
  }
  var nowI = Math.min(N - 1, Math.floor((Date.now() - d0) / 300000));
  svg.appendChild(el('line', { x1: x(nowI), x2: x(nowI), y1: top, y2: top + H, class: 'nowline' }));
}

function drawDays(days) {
  var svg = document.getElementById('days'), b = box(svg), cs = getComputedStyle(document.documentElement);
  var left = 30, right = 4, top = 6, bottom = 20;
  var W = b.w - left - right, H = b.h - top - bottom;
  var max = 0;
  days.forEach(function (d) { max = Math.max(max, d.use || 0, d.sol || 0); });
  max = niceMax(Math.max(max, 1));
  var base = top + H, scale = H / max;
  [max, max / 2].forEach(function (v) {
    var y = base - v * scale;
    svg.appendChild(el('line', { x1: left, x2: b.w - right, y1: y, y2: y, class: 'gridline' }));
    svg.appendChild(el('text', { x: left - 6, y: y + 4, 'text-anchor': 'end', class: 'axis' }, HA.num(v)));
  });
  var slot = W / Math.max(1, days.length), bw = slot * 0.3;
  days.forEach(function (d, i) {
    var cx = left + i * slot + slot / 2;
    var hu = (d.use || 0) * scale, hs = (d.sol || 0) * scale;
    svg.appendChild(el('rect', { x: cx - bw - 1.5, y: base - hu, width: bw, height: hu, rx: 2, fill: cs.getPropertyValue('--home'), 'fill-opacity': .85 }));
    svg.appendChild(el('rect', { x: cx + 1.5, y: base - hs, width: bw, height: hs, rx: 2, fill: cs.getPropertyValue('--sun') }));
    svg.appendChild(el('text', { x: cx, y: b.h - 4, 'text-anchor': 'middle', class: 'axis', 'font-weight': i === days.length - 1 ? 600 : 400 }, d.d));
  });
  svg.appendChild(el('line', { x1: left, x2: b.w - right, y1: base, y2: base, class: 'zero' }));
}

function render(data) {
  var e = data.energy || {}, now = e.now || {}, t = e.today || {};
  document.getElementById('meta').textContent = data.updated ? 'bijgewerkt ' + HA.time(data.updated) : '';
  drawFlow(now, t.gas);
  var sol = t.solar || 0, imp = t.import || 0, exp = t.export || 0;
  var bin = t.bat_in || 0, bout = t.bat_out || 0;
  var use = Math.max(0, imp + sol - exp + bout - bin), own = Math.max(0, use - imp);
  document.getElementById('tSol').innerHTML = kwh(sol);
  document.getElementById('tSolSub').textContent = sol > 0 ? HA.num(Math.max(0, sol - exp), 1) + ' kWh zelf gebruikt' : 'nog geen opwek';
  document.getElementById('tUse').innerHTML = kwh(use);
  document.getElementById('tUseSub').textContent = use > 0 ? 'eigen opwek' : '';
  ring(use > 0 ? own / use : 0);
  document.getElementById('tImp').innerHTML = kwh(imp);
  document.getElementById('tImpSub').textContent = use > 0 ? HA.num(imp / use * 100) + '% van het verbruik' : '';
  document.getElementById('tExp').innerHTML = kwh(exp);
  document.getElementById('tExpSub').textContent = sol > 0 ? HA.num(Math.min(100, exp / sol * 100)) + '% van de opwek' : '';
  document.getElementById('tBat').innerHTML = now.soc !== undefined && now.soc !== null ? HA.num(now.soc) + '<small>%</small>' : '–';
  document.getElementById('tBatSub').textContent = (t.bat_in !== undefined ? HA.num(bin, 1) + ' kWh in · ' + HA.num(bout, 1) + ' kWh uit' : '');
  document.getElementById('tGas').innerHTML = t.gas !== undefined && t.gas !== null ? HA.num(t.gas, t.gas < 10 ? 1 : 0) + '<small>m³</small>' : '–';
  document.getElementById('tGasSub').textContent = now.gas_live ? 'brandt nu' : '';
  var curve = e.series && e.series.length > 1;
  document.getElementById('hoursLbl').textContent = curve ? 'Vandaag' : 'Vandaag per uur';
  document.getElementById('hoursLeg').innerHTML = curve
    ? '<span><span class="dot" style="background:var(--sun)"></span>zon</span><span><span class="dot" style="background:var(--home)"></span>huis</span><span><span class="dot" style="background:var(--grid)"></span>net</span>' + (e.series.some(function (r) { return r.length > 3 && r[3] !== null; }) ? '<span><span class="dot" style="background:var(--bat)"></span>accu</span>' : '')
    : '<span><span class="dot" style="background:var(--sun)"></span>zon gebruikt</span><span><span class="dot" style="background:var(--grid)"></span>van net</span><span><span class="dot" style="background:var(--export)"></span>terug</span>';
  if (curve) drawCurve(e.series); else drawHours(e.hours || []);
  drawDays(e.days || []);
}
HA.start(render);
</script>
</body>
</html>
